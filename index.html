<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOEIC Listening 2026 - Bảng Đáp Án</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--soft:#dbeafe;--mark:#fde68a}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--text:#e5e7eb;--muted:#94a3b8;--line:#2a303b;--accent:#7db2ff;--soft:#1e3350;--mark:#7a5a05;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:0 0;border:0;padding:0}
[hidden]{display:none!important}

/* ---------- Part 1 ---------- */
.page{min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.w{max-width:1000px;margin:0 auto;padding:0 12px}
.hd{z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 0;position:sticky;top:0}
.top{justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;display:flex}
.top h1{margin:0;font-size:17px}
.lnk{border:1px solid var(--line);background:var(--card);color:var(--accent);white-space:nowrap;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600;text-decoration:none}
.search{border:1px solid var(--line);background:var(--bg);width:100%;color:var(--text);border-radius:10px;padding:10px 12px;font-size:16px;display:block}
.bar{scrollbar-width:none;align-items:center;gap:6px;margin-top:8px;display:flex;overflow-x:auto}
.bar::-webkit-scrollbar{display:none}
.chip{border-radius:999px;flex:none;font-size:13px;border:1px solid var(--line)!important;background:var(--card)!important;padding:5px 12px!important}
.chip.on{color:#fff;background:var(--accent)!important;border-color:var(--accent)!important}
.sp{flex:1}
.seg{flex:none;display:flex}
.seg button{font-size:13px;border:1px solid var(--line)!important;background:var(--card)!important;padding:5px 11px!important}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button+button{border-left:0!important}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{color:var(--bg);background:var(--text)!important;border-color:var(--text)!important}
@media (max-width:599px){.hideSm{display:none!important}.seg .lastSm{border-radius:0 8px 8px 0}}
.info{color:var(--muted);padding:10px 0 6px;font-size:13px}
.grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;display:grid;padding-bottom:16px}
.grid.big2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.rows{gap:8px;display:grid;padding-bottom:16px}
.card,.row{border-radius:12px;width:100%;transition:border-color .15s,transform .15s;display:block;text-align:left!important;background:var(--card)!important;border:1px solid var(--line)!important}
.card:hover,.row:hover{transform:translateY(-1px);border-color:var(--accent)!important}
.ch{justify-content:space-between;align-items:baseline;padding:10px 12px 0;display:flex}
.ch b{font-size:16px}
.ch span{color:var(--muted);font-size:12px}
.mos{grid-template-columns:repeat(3,1fr);gap:4px;padding:8px 10px 10px;display:grid}
.mos .ph:first-child{aspect-ratio:auto;grid-area:1/1/3/3}
.mos.one .ph:first-child{aspect-ratio:4/3;grid-area:auto/1/auto/-1}
.big2 .mos{grid-template-columns:repeat(5,1fr);gap:5px}
.big2 .mos .ph:first-child{aspect-ratio:4/3;grid-area:auto/1/auto/-1}
.row{align-items:center;gap:10px;padding:8px 10px!important;display:flex!important}
.row>b{flex:none;width:54px;font-size:14px}
.strip{flex:1;grid-template-columns:2fr repeat(5,1fr);align-items:center;gap:3px;min-width:0;display:grid}
.strip .q{display:none}
.ph{aspect-ratio:4/3;background:var(--line);border-radius:7px;position:relative;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.contain img{object-fit:contain}
.q{color:#fff;background:#0f172ab8;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600;position:absolute;bottom:3px;left:3px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.ov{z-index:20;background:#0206178c;justify-content:center;align-items:flex-end;display:flex;position:fixed;inset:0}
.pn{background:var(--bg);width:100%;max-width:720px;max-height:96%;padding-bottom:env(safe-area-inset-bottom,0px);border-radius:16px 16px 0 0;overflow:auto}
@media (min-width:760px){.ov{align-items:center}.pn{border-radius:16px;max-height:92%}}
.mh{z-index:2;background:var(--card);border-bottom:1px solid var(--line);align-items:center;gap:6px;padding:10px 12px;display:flex;position:sticky;top:0}
.mh h2{flex:1;margin:0;font-size:17px}
.ib{border-radius:8px;font-size:13px;border:1px solid var(--line)!important;background:var(--card)!important;padding:6px 11px!important}
.mb{padding:12px}
.bigv{position:relative}
.bigv .ph{border-radius:12px}
.bigv .q{padding:3px 9px;font-size:13px;bottom:8px;left:8px}
.nav{border-radius:50%;width:38px;height:38px;font-size:22px;line-height:1;position:absolute;top:50%;transform:translateY(-50%);color:#fff!important;background:#0f172a99!important}
.nav.l{left:8px}.nav.r{right:8px}
.ans{color:#fff;background:#16a34a;border-radius:6px;padding:3px 10px;font-size:14px;font-weight:700;position:absolute;bottom:8px;right:8px}
.thumbs{grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px;display:grid}
.thumbs button{opacity:.65;border-radius:9px;border:2px solid #0000!important;padding:1px!important}
.thumbs button.on{opacity:1;border-color:var(--accent)!important}
.sw{align-items:center;gap:8px;margin:12px 0 4px;font-size:14px;display:flex}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.mb h3{color:var(--muted);margin:16px 0 8px;font-size:13px;font-weight:650}
.keys{grid-template-columns:repeat(5,1fr);gap:5px;display:grid}
.k{background:var(--card);border:1px solid var(--line);border-radius:7px;justify-content:space-between;gap:4px;padding:6px 8px;font-size:13px;display:flex}
.k span{color:var(--muted)}
.k b{color:var(--accent)}
.p1{border-color:var(--accent);background:var(--soft)}

/* ---------- Part 7 ---------- */
.p7-wrap{max-width:760px;margin:0 auto;padding:0 12px}
.p7-hd{z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 0;padding-top:max(8px,env(safe-area-inset-top));position:sticky;top:0}
.p7-top{align-items:center;gap:12px;display:flex}
.p7-top a{color:var(--accent);white-space:nowrap;font-size:14px;font-weight:600;text-decoration:none}
.p7-top h1{margin:0;font-size:16px;line-height:1.25}
.p7-q{border:1px solid var(--line);background:var(--bg);width:100%;color:var(--text);border-radius:10px;margin-top:8px;padding:10px 12px;font-size:16px;display:block}
.p7-q:focus{outline:2px solid var(--accent);border-color:#0000}
.p7-tools{color:var(--muted);flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0 8px;font-size:13px;display:flex}
.p7-tools .p7-sp{flex:1;min-width:8px}
.p7-seg{display:flex}
.p7-seg button,.p7-lnk{border:1px solid var(--line);background:var(--card);padding:5px 11px;font-size:13px}
.p7-seg button:first-child{border-radius:8px 0 0 8px}
.p7-seg button:last-child{border-left:0;border-radius:0 8px 8px 0}
.p7-seg button.p7-on{background:var(--text);border-color:var(--text);color:var(--bg)}
.p7-lnk{border-radius:8px}
.p7-card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 8px;overflow:hidden}
.p7-head{text-align:left;align-items:flex-start;gap:8px;width:100%;min-height:44px;padding:10px 12px;display:flex}
.p7-title{overflow-wrap:anywhere;flex:1;font-weight:650}
.p7-chev{color:var(--muted);flex:none;transition:transform .15s}
.p7-card.p7-open .p7-chev{transform:rotate(90deg)}
.p7-body{border-top:1px solid var(--line);padding:0 12px 10px;display:none}
.p7-card.p7-open .p7-body{display:block}
.p7-sub{color:var(--muted);overflow-wrap:anywhere;padding:6px 0 0;font-size:12.5px}
.p7-ans{margin:6px 0 0;padding:0 0 0 1.2em}
.p7-ans li{overflow-wrap:anywhere;padding:3px 0}
.p7-ans li::marker{color:var(--accent)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.p7-empty{text-align:center;color:var(--muted);padding:28px 0}
</style>
</head>
<body>

<div id="p1" class="page">
  <header class="hd"><div class="w">
    <div class="top"><h1>Tìm đề theo ảnh Part 1</h1><a class="lnk" href="#p7">📖 Đáp án Part 7</a></div>
    <input id="s1" class="search" type="search" placeholder="Nhập số đề (vd: 12)" inputmode="numeric" autocomplete="off">
    <div class="bar">
      <button class="chip on" data-g="0">Tất cả</button>
      <button class="chip" data-g="1">Đề 1–10</button>
      <button class="chip" data-g="2">Đề 11–20</button>
      <button class="chip" data-g="3">Đề 21–30</button>
      <span class="sp"></span>
      <div class="seg">
        <button class="on" data-v="grid">Lưới</button>
        <button class="lastSm" data-v="big">Lớn</button>
        <button class="hideSm" data-v="rows">Dòng</button>
      </div>
    </div>
  </div></header>
  <main class="w">
    <div class="info" id="info"></div>
    <p class="empty" id="empty1" hidden>Không có đề phù hợp</p>
    <div id="list" class="grid"></div>
  </main>
</div>

<div id="modal" class="ov" hidden>
  <div class="pn" id="pn">
    <div class="mh">
      <button class="ib" id="mPrev">‹</button>
      <h2 id="mTitle"></h2>
      <button class="ib" id="mNext">›</button>
      <button class="ib" id="mClose">Đóng</button>
    </div>
    <div class="mb" id="mBody"></div>
  </div>
</div>

<div id="p7" hidden>
  <header class="p7-hd"><div class="p7-wrap">
    <div class="p7-top"><a href="#">← Trang chủ</a><h1>Đáp án Part 7 · Hacker 2 &amp; 3</h1></div>
    <input id="s7" class="p7-q" type="search" placeholder="Tìm tiêu đề hoặc đáp án" autocomplete="off" enterkeyhint="search">
  </div></header>
  <main class="p7-wrap">
    <div class="p7-tools">
      <div class="p7-seg">
        <button class="p7-on" data-sort="1">A–Z</button>
        <button data-sort="-1">Z–A</button>
      </div>
      <span class="p7-sp" id="p7count"></span>
      <button class="p7-lnk" id="p7open">Mở hết</button>
      <button class="p7-lnk" id="p7close">Thu gọn</button>
    </div>
    <div id="p7list"></div>
  </main>
</div>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N = TESTS.length;
const SIX = [1,2,3,4,5,6];
const qs = id => id <= 20 ? SIX : [1];

function fallback(img, id, i) {
  img.onerror = null;
  img.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="100%" height="100%" fill="#e2e8f0"/><text x="200" y="160" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#64748b" text-anchor="middle">Đề ${id} · Câu ${i}</text></svg>`);
}
function ph(id, i, contain) {
  const src = IMG_BASE + (id <= 20 ? `/Photo_v1/test${id}/q${i}.png` : `/Photo_v2/T${id - 20}.png`);
  return `<div class="ph${contain ? " contain" : ""}"><img loading="lazy" alt="Đề ${id} - Câu ${i}" src="${src}" onerror="fallback(this,${id},${i})">${id <= 20 ? `<span class="q">Câu ${i}</span>` : ""}</div>`;
}

/* ---------- Part 1 ---------- */
const st = { view: "grid", group: 0, q: "", open: null, idx: 0, show: false };

function renderList() {
  const digits = st.q.replace(/\D/g, "");
  const items = TESTS.filter(t => (!st.group || Math.ceil(t.id / 10) === st.group) && (!st.q.trim() || (!!digits && String(t.id).startsWith(digits))));
  $("#info").textContent = `${items.length} / ${N} đề`;
  $("#empty1").hidden = items.length > 0;
  const list = $("#list");
  list.className = st.view === "rows" ? "rows" : "grid" + (st.view === "big" ? " big2" : "");
  list.innerHTML = items.map(t => st.view === "rows"
    ? `<button class="row" data-id="${t.id}"><b>Đề ${t.id}</b><div class="strip">${qs(t.id).map(i => ph(t.id, i)).join("")}</div></button>`
    : `<button class="card" data-id="${t.id}"><div class="ch"><b>Đề ${t.id}</b><span>${t.id <= 20 ? "Part 1 · Câu 1–6" : ""}</span></div><div class="mos${t.id > 20 ? " one" : ""}">${qs(t.id).map(i => ph(t.id, i)).join("")}</div></button>`
  ).join("");
}

function renderModal() {
  const t = TESTS.find(x => x.id === st.open);
  const modal = $("#modal");
  if (!t) { modal.hidden = true; document.body.style.overflow = ""; return; }
  const p1 = t.id <= 20;
  modal.hidden = false;
  document.body.style.overflow = "hidden";
  $("#mTitle").textContent = `Đề ${t.id}`;
  $("#mBody").innerHTML =
    `<div class="bigv">${ph(t.id, st.idx + 1, !p1)}` +
    (p1 ? `<button class="nav l" data-nav="-1">‹</button><button class="nav r" data-nav="1">›</button>` : "") +
    (p1 && st.show ? `<span class="ans">Đáp án: ${t.answers[st.idx]}</span>` : "") + `</div>` +
    (p1 ? `<div class="thumbs">${SIX.map(i => `<button class="${i === st.idx + 1 ? "on" : ""}" data-th="${i - 1}">${ph(t.id, i)}</button>`).join("")}</div>
           <label class="sw"><input type="checkbox" id="showAns"${st.show ? " checked" : ""}> Hiện đáp án Part 1</label>` : "") +
    `<h3>${p1 ? "BẢNG ĐÁP ÁN 100 CÂU · Part 1 (câu 1–6) được tô màu" : "BẢNG ĐÁP ÁN 100 CÂU"}</h3>` +
    `<div class="keys">${t.answers.map((a, i) => `<div class="k${p1 && i < 6 ? " p1" : ""}"><span>${i + 1}.</span><b>${a}</b></div>`).join("")}</div>`;
}

function openTest(id) {
  const changed = st.open !== id;
  st.open = id; st.idx = 0;
  renderModal();
  if (changed) $("#pn").scrollTop = 0;
}
const step = d => { const n = st.open <= 20 ? 6 : 1; st.idx = (st.idx + d + n) % n; renderModal(); };

$("#s1").addEventListener("input", e => { st.q = e.target.value; renderList(); });
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  st.group = +b.dataset.g;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
  renderList();
}));
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  st.view = b.dataset.v;
  document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
  renderList();
}));
$("#list").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) openTest(+b.dataset.id); });
$("#modal").addEventListener("click", e => { if (e.target === e.currentTarget) { st.open = null; renderModal(); } });
$("#mClose").addEventListener("click", () => { st.open = null; renderModal(); });
$("#mPrev").addEventListener("click", () => openTest((st.open + N - 2) % N + 1));
$("#mNext").addEventListener("click", () => openTest(st.open % N + 1));
$("#mBody").addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]"); if (nav) return step(+nav.dataset.nav);
  const th = e.target.closest("[data-th]"); if (th) { st.idx = +th.dataset.th; renderModal(); }
});
$("#mBody").addEventListener("change", e => { if (e.target.id === "showAns") { st.show = e.target.checked; renderModal(); } });
window.addEventListener("keydown", e => {
  if (st.open === null) return;
  if (e.key === "Escape") { st.open = null; renderModal(); }
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* ---------- Part 7 ---------- */
const P7I = P7.map((e, i) => ({ i, title: e.t[0], extra: e.t.slice(1), ans: e.a }));
const p7 = { sort: 1, q: "", collapsed: new Set(P7I.map(e => e.i)) };

function hl(text, re) {
  if (!re) return esc(text);
  return text.split(re).map((s, k) => k % 2 ? `<mark>${esc(s)}</mark>` : esc(s)).join("");
}
function renderP7() {
  const terms = p7.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const re = terms.length ? new RegExp("(" + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi") : null;
  const items = P7I.filter(e => {
    const hay = (e.title + " " + e.extra.join(" ") + " " + e.ans.join(" ")).toLowerCase();
    return terms.every(t => hay.includes(t));
  }).sort((a, b) => p7.sort * a.title.localeCompare(b.title, "en", { sensitivity: "base" }));
  $("#p7count").textContent = `${items.length} bài đọc`;
  $("#p7list").innerHTML = items.length === 0 ? `<div class="p7-empty">Không có kết quả</div>` : items.map(e => {
    const open = !p7.collapsed.has(e.i);
    return `<div class="p7-card${open ? " p7-open" : ""}">
      <button class="p7-head" data-i="${e.i}" aria-expanded="${open}"><span class="p7-title">${hl(e.title, re)}</span><span class="p7-chev">▸</span></button>
      <div class="p7-body">${e.extra.length ? `<div class="p7-sub">${hl(e.extra.join("  ·  "), re)}</div>` : ""}
        <ul class="p7-ans">${e.ans.map(a => `<li>${hl(a, re)}</li>`).join("")}</ul></div></div>`;
  }).join("");
}
$("#s7").addEventListener("input", e => {
  p7.q = e.target.value;
  p7.collapsed = p7.q.trim() ? new Set() : new Set(P7I.map(x => x.i));
  window.scrollTo(0, 0);
  renderP7();
});
$("#s7").addEventListener("keydown", e => { if (e.key === "Enter") e.currentTarget.blur(); });
document.querySelectorAll(".p7-seg button").forEach(b => b.addEventListener("click", () => {
  p7.sort = +b.dataset.sort;
  document.querySelectorAll(".p7-seg button").forEach(x => x.classList.toggle("p7-on", x === b));
  window.scrollTo(0, 0);
  renderP7();
}));
$("#p7open").addEventListener("click", () => { p7.collapsed = new Set(); renderP7(); });
$("#p7close").addEventListener("click", () => { p7.collapsed = new Set(P7I.map(e => e.i)); renderP7(); });
$("#p7list").addEventListener("click", e => {
  const h = e.target.closest(".p7-head"); if (!h) return;
  const i = +h.dataset.i;
  p7.collapsed.has(i) ? p7.collapsed.delete(i) : p7.collapsed.add(i);
  renderP7();
});

/* ---------- routing ---------- */
function route() {
  const isP7 = location.hash === "#p7";
  $("#p1").hidden = isP7;
  $("#p7").hidden = !isP7;
  if (isP7) { st.open = null; renderModal(); }
  document.title = isP7 ? "Đáp án Part 7 · Hacker 2 & 3" : "TOEIC Listening 2026 - Bảng Đáp Án";
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
renderList();
renderP7();
route();
</script>
